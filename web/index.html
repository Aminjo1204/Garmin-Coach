<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pace Coach</title>
  <meta name="theme-color" content="#0d0f13">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Coach">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo"></span>Pace Coach</div>
    <nav class="tabs" id="tabs">
      <button data-view="heute"><svg class="ti" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>Heute</span></button>
      <button data-view="woche"><svg class="ti" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Woche</span></button>
      <button data-view="plan"><svg class="ti" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Plan</span></button>
      <button data-view="aktivitaeten"><svg class="ti" viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg><span>Aktivitäten</span></button>
      <button data-view="fortschritt"><svg class="ti" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Fortschritt</span></button>
    </nav>
    <button class="sync" id="syncBtn" title="Neue Daten von Garmin holen">
      <svg viewBox="0 0 24 24" width="16" height="16"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span id="syncLabel">Sync</span>
    </button>
  </header>
  <main id="view" class="view"><div class="loading">Lade Daten …</div></main>
  <div class="modal" id="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card" role="dialog" aria-modal="true">
      <button class="modal-close" data-close aria-label="Schließen">×</button>
      <div id="modalBody"></div>
    </div>
  </div>
  <div class="tooltip" id="tooltip" hidden></div>
  <div class="toast" id="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>
